# 開発ツールのバージョンはここで固定する（CI も同じファイルを使う）
[tools]
flutter = "3.47.7"
java = "temurin-25"

[tasks.check]
description = "PR 前の確認（format・analyze・widget test）"
run = [
  "flutter pub get --enforce-lockfile",
  "dart format --output=none --set-exit-if-changed lib test integration_test",
  "flutter analyze",
  "flutter test",
]

[tasks.device-test]
description = "接続中の Android 端末・エミュレーターで起動・編集・保存テスト"
run = "flutter test integration_test/app_test.dart integration_test/gallery_save_test.dart integration_test/photo_edit_save_test.dart integration_test/text_regions_device_test.dart integration_test/object_regions_device_test.dart"

[tasks.apk]
description = "デモ APK を dist/ に作る"
run = "bash scripts/build-android-demo.sh"

[tasks.detector-apk]
description = "人物・画面検出を同梱した別IDのARM64 APKを作る"
run = "bash scripts/build-android-detectors.sh"

[tasks.detector-install]
description = "検出器プレビューAPKをUSB接続端末へインストールする"
run = "bash scripts/install-android-detectors.sh"
