name: Mobile checks and Android demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android launch test and demo APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test launch on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/app_test.dart -d emulator-5554
      - name: Build Android demo
        run: bash scripts/build-android-demo.sh --build-number="$GITHUB_RUN_NUMBER"
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: camereon-android-demo
          path: |
            dist/camereon-demo.apk
            dist/camereon-demo.apk.sha256
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS Simulator build and launch test
    needs: quality
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Test launch on iOS Simulator
        run: bash scripts/test-ios.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ios-startup-screenshot
          path: dist/ios-startup.png
          if-no-files-found: error
          retention-days: 14
