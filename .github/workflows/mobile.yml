name: Android checks and demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Format, analyze and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android demo APK
    # quality と並列に走らせる。main ではキャッシュ作成を beta ジョブが兼ねる
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - id: ndk
        name: Resolve Flutter NDK version
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          extension = Path(os.environ["FLUTTER_ROOT"]) / "packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          version = re.search(r'val ndkVersion:\s*String\s*=\s*"([^"]+)"', extension.read_text())[1]
          Path(os.environ["GITHUB_OUTPUT"]).write_text(f"path={os.environ['ANDROID_HOME']}/ndk/{version}\nversion={version}\n")
          PYCODE
      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: android-ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}
      - name: Build Android demo APK
        timeout-minutes: 10
        # 実機配布用なので arm64 のみ
        run: bash scripts/build-android-demo.sh --build-number="$GITHUB_RUN_NUMBER" --target-platform android-arm64
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: camereon-android-demo
          path: |
            dist/camereon-demo.apk
            dist/camereon-demo.apk.sha256
          if-no-files-found: error
          retention-days: 30

  beta:
    name: Build signed Android beta
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - id: ndk
        name: Resolve Flutter NDK version
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          extension = Path(os.environ["FLUTTER_ROOT"]) / "packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          version = re.search(r'val ndkVersion:\s*String\s*=\s*"([^"]+)"', extension.read_text())[1]
          Path(os.environ["GITHUB_OUTPUT"]).write_text(f"path={os.environ['ANDROID_HOME']}/ndk/{version}\nversion={version}\n")
          PYCODE
      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: android-ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}
      - id: signing
        name: Restore beta signing key
        env:
          CAMEREON_BETA_KEYSTORE_BASE64: ${{ secrets.CAMEREON_BETA_KEYSTORE_BASE64 }}
        run: python3 scripts/beta_release.py restore-key
      - id: build
        name: Build and verify signed beta APK
        timeout-minutes: 10
        env:
          CAMEREON_BETA_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          CAMEREON_BETA_PASSWORD: ${{ secrets.CAMEREON_BETA_PASSWORD }}
          CAMEREON_BETA_CERT_SHA256: ${{ vars.CAMEREON_BETA_CERT_SHA256 }}
        run: bash scripts/build-android-beta.sh
      - name: Upload verified beta APK
        uses: actions/upload-artifact@v7
        with:
          name: camereon-beta
          path: dist/beta/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/camereon-beta-signing.p12"

  publish_beta:
    name: Publish beta GitHub Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: beta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: camereon-beta
          path: dist/beta
      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/beta_release.py publish
