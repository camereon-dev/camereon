name: Checks and beta release

on:
  push:
    branches: [main]
  pull_request:
  # main で実行すると新しいベータ版を公開する
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Format, analyze and widget tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts/tests -v
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  beta:
    name: Build signed Android beta
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          android: 'true'
      - id: signing
        name: Restore beta signing key
        env:
          CAMEREON_BETA_KEYSTORE_BASE64: ${{ secrets.CAMEREON_BETA_KEYSTORE_BASE64 }}
        run: python3 scripts/beta_release.py restore-key
      - id: build
        name: Build and verify signed beta APK
        timeout-minutes: 10
        env:
          CAMEREON_BETA_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          CAMEREON_BETA_PASSWORD: ${{ secrets.CAMEREON_BETA_PASSWORD }}
          CAMEREON_BETA_CERT_SHA256: ${{ vars.CAMEREON_BETA_CERT_SHA256 }}
        run: bash scripts/build-android-beta.sh
      - name: Upload verified beta APK
        uses: actions/upload-artifact@v7
        with:
          name: camereon-beta
          compression-level: 0
          path: dist/beta/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/camereon-beta-signing.p12"

  publish_beta:
    name: Publish beta GitHub Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, beta]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: camereon-beta
          path: dist/beta
      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/beta_release.py publish
