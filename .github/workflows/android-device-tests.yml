name: Android device tests

# エミュレーターは重いので、必要なときだけ実行する:
# PR に `device-test` ラベルを付ける（以降の push でも再実行）か、手動実行。
on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android launch test and demo APK
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'device-test')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          android: 'true'
      - run: flutter pub get --enforce-lockfile
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test launch on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            flutter test integration_test/app_test.dart -d emulator-5554
            bash scripts/build-android-demo.sh --build-number="$GITHUB_RUN_NUMBER"
            adb install -r dist/camereon-demo.apk
            adb shell am start -W -n dev.camereon.camereon.demo/.MainActivity
            sleep 3
            adb shell pidof dev.camereon.camereon.demo
            adb exec-out screencap -p > dist/android-startup.png
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: camereon-android-demo
          path: |
            dist/camereon-demo.apk
            dist/camereon-demo.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android launch screenshot
        uses: actions/upload-artifact@v7
        with:
          name: android-startup-screenshot
          path: dist/android-startup.png
          if-no-files-found: error
          retention-days: 14
